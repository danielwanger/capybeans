[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]

sqlx = {version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros"
]}

tokio = {version = "1", features = ["full"]}
dotenvy = "0.15"
uuid = "1.29.3"
chrono = "0.4.45"
